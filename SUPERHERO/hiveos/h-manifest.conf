####################################################################################
###
### SUPERHERO - BTX (btx-matmul) miner for HiveOS / AMD
###
####################################################################################

# Name for miner installation directory and systemd service
MINER_NAME=superhero

# Executable within the miner directory
MINER_BIN=superhero

# API port used by h-stats.sh (custom placeholder)
MINER_API=39001

# Algorithm displayed in HiveOS
MINER_ALGO=btx-matmul

# Default config version
CONFIG_VERSION=0.2.0

# Miner config files
MINER_CONFIG=(
    "config.conf"
)

# Parseable hashrate units
HASHRATE_UNITS=("h" "kh" "mh" "gh")

# AMD only
GPU_SUPPORTED=(amd)

# No CPU mining
CPU_SUPPORTED=(0)

# Miner works with all AMD driver versions on HiveOS
AMD_DRIVER_SUPPORTED=(amdgpu)

# Allow custom miner install
CUSTOM_MINER=true

# Miner repository URL for auto-updates (GitHub releases)
MINER_REPO="https://github.com/Crypto-EU/Sample"

# Release tag prefix
RELEASE_TAG_PREFIX="superhero-v"

# Miner version - updated by release script
MINER_LATEST_VER=0.2.0

# Install URL template
MINER_LATEST_VER_URL="https://github.com/Crypto-EU/Sample/releases/download/superhero-v0.2.0/superhero-0.2.0.tar.gz"

# SHA256 of release tarball (updated by release script)
MINER_LATEST_VER_SHA256="e21908328847bdfef242ad76466adbc081acfbdf460b1d5fa31b598f12c1be24"

# Manifest version
MANIFEST_VER=0.2.0
