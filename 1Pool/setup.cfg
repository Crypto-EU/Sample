[metadata]
name = onepool
version = 1.0.0
description = Self-hosted SASEUL mining pool (RabbitMiner-compatible)
author = Crypto-EU
license = MIT

[options]
packages = find:
python_requires = >=3.10
install_requires =
    aiohttp>=3.9.0
    PyYAML>=6.0

[options.entry_points]
console_scripts =
    onepool = onepool.__main__:main
