services:
  onepool:
    build: .
    container_name: onepool
    restart: unless-stopped
    ports:
      - "1911:1911"   # stratum TCP (1Miner --pool)
      - "8080:8080"   # dashboard
    environment:
      ONEPOOL_MODE: proxy
      # Set your SASEUL wallet used for upstream login:
      ONEPOOL_UPSTREAM_WALLET: "YOUR_SASEUL_WALLET"
      ONEPOOL_UPSTREAM: "nl.rabbitminer.cc:1901,fi.rabbitminer.cc:1901"
      ONEPOOL_FEE: "1.0"
      ONEPOOL_POOL_NAME: "1Pool"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
